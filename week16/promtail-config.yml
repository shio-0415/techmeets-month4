server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # logging=promtail ラベルが付いたコンテナだけを対象にする
      - source_labels: [__meta_docker_container_label_logging]
        regex: promtail
        action: keep
      - source_labels: [__meta_docker_container_label_logging_jobname]
        target_label: job
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container

    pipeline_stages:
      # アプリがJSON構造化ログを出しているので、
      # levelやmessageをLokiのラベル/フィールドとして展開する
      - json:
          expressions:
            level: level
            message: message
            timestamp: timestamp
      - labels:
          level:
      - timestamp:
          source: timestamp
          format: RFC3339
