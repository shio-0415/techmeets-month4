# ============================================================
# ログ集中管理スタック: Loki + Promtail + Grafana
# アプリコンテナはstdout/stderrにJSON構造化ログを出すだけでよく、
# Promtailがdocker socket経由で全コンテナのログを収集し、
# Lokiに集約、Grafanaで検索・可視化する。
# ============================================================
version: "3.8"

services:
  app:
    build:
      context: .
    ports:
      - "3000:3000"
    # json-fileドライバでも良いが、ローテーションを必ず設定する
    # （設定しないとディスクを圧迫し続ける）
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      # Promtailがこのラベルでどのコンテナのログか識別できる
      logging: "promtail"
      logging_jobname: "week16-app"

  loki:
    image: grafana/loki:2.9.8
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki

  promtail:
    image: grafana/promtail:2.9.8
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
      # コンテナログの実体とdockerソケットを読み取り専用でマウント
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=change_me
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki

volumes:
  loki-data:
  grafana-data:
